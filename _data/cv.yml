        location: China
        start_date: 2020-07
        end_date: 2021-12
        summary: Developed production multi-task LiDAR perception models for detection, instance polygons, semantic segmentation, and motion segmentation.
        highlights:
          - Built multi-task training pipelines and sparse/dense model heads for online inference.
          - Improved overall detection mAP by 3-5% and small-object mAP by 5-10% over the previous production model.
          - Contributed methods that reached second place in nuScenes detection and third place in nuScenes semantic segmentation.

